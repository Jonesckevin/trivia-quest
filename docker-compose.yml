services:
  trivia-quest:
    build: .
    container_name: trivia-quest
    ports:
      - "3002:80"
    environment:
      - APP_TITLE=Trivia Quest
      # JWT — leave blank to auto-generate on each start (set a value for persistence)
      - JWT_SECRET=
      - JWT_TTL_SECONDS=86400
      # CORS — must include the full origin with protocol (https://) to match browser Origin headers
      - CORS_ALLOWED_ORIGINS=http://localhost:3002
      # Rate limiting
      - LOGIN_RATE_MAX=5
      - LOGIN_RATE_WINDOW=900
      - REG_RATE_MAX=3
      - REG_RATE_WINDOW=3600
      # Proxy / HTTPS trust (set true when behind a reverse proxy that sets X-Forwarded-For)
      - TRUST_PROXY=true
      # File upload
      - MAX_UPLOAD_MB=25
      # Quiz settings
      - ADMIN_PASSWORD=admin123
      - FREEPLAY=true
      - REQUIRE_USER_PASSWORD=true
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/ && wget -q --spider http://127.0.0.1/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    volumes:
      - ./data:/data
    # Optional: Mount custom question bank for updates without rebuild
    # volumes:
    #   - ./question_bank:/question_bank:ro
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
          pids: 512

volumes: {}
